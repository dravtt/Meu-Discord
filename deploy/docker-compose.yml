# Voka em produção numa VPS que JÁ tem um proxy reverso nas portas 80/443.
# - Nada aqui usa as portas 80/443: o proxy existente repassa o domínio para 127.0.0.1.
# - Projeto, rede, volumes e banco são exclusivos do Voka (prefixo "voka").
# - O PostgreSQL não é publicado: só os outros contentores do Voka chegam nele.
# - Limite total: 2 vCPU e ~3,8 GB de RAM (soma dos limites abaixo).
# Toda a configuração vem de deploy/.env (modelo: deploy/.env.example).
name: voka

x-logs: &logs
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

networks:
  voka_net:
    name: voka_net

volumes:
  voka_pgdata:   { name: voka_pgdata }
  voka_uploads:  { name: voka_uploads }

services:
  app:
    build: { context: .., dockerfile: Dockerfile }
    # Fixed tag: update.sh/rollback.sh move it between versions by image ID.
    image: voka-app:current
    container_name: voka-app
    restart: unless-stopped
    env_file: ${VOKA_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://voka:${DB_PASSWORD}@voka-postgres:5432/voka
      WEB_ORIGIN: https://${VOKA_DOMAIN}
      PUBLIC_URL: https://${VOKA_DOMAIN}
      LIVEKIT_URL: wss://${VOKA_DOMAIN}
      # Requests come from the reverse proxy on this VPS (via the Docker bridge gateway).
      TRUST_PROXY: loopback, uniquelocal
    networks: [voka_net]
    volumes: [voka_uploads:/data/uploads]
    ports: ["127.0.0.1:${VOKA_APP_PORT:-3001}:3001"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy: { resources: { limits: { cpus: "0.8", memory: 1536m } } }
    <<: *logs

  postgres:
    image: postgres:16
    container_name: voka-postgres
    restart: unless-stopped
    environment: { POSTGRES_USER: voka, POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: voka }
    networks: [voka_net]
    volumes: [voka_pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "voka"], interval: 5s, retries: 20 }
    deploy: { resources: { limits: { cpus: "0.5", memory: 1g } } }
    <<: *logs

  # Voice/video. Signalling goes through the reverse proxy (127.0.0.1:7880, paths /rtc and /twirp);
  # the media itself goes straight to the VPS on TCP 7881 and UDP 7882, which must be open.
  livekit:
    image: livekit/livekit-server:v1.13
    container_name: voka-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    networks: [voka_net]
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "127.0.0.1:${VOKA_LIVEKIT_PORT:-7880}:7880"
      # Same number outside and inside: LiveKit announces these ports to the callers.
      - "${VOKA_RTC_TCP_PORT:-7881}:${VOKA_RTC_TCP_PORT:-7881}/tcp"
      - "${VOKA_RTC_UDP_PORT:-7882}:${VOKA_RTC_UDP_PORT:-7882}/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { cpus: "0.6", memory: 1g } } }
    <<: *logs

  # One verified copy of the database per day in deploy/backups, keeping 14 days (see backup-loop.sh).
  backup:
    image: postgres:16
    container_name: voka-backup
    restart: unless-stopped
    environment: { PGPASSWORD: "${DB_PASSWORD}", VOKA_BACKUP_TIME: "${VOKA_BACKUP_TIME:-03:30}", TZ: "${TZ:-America/Sao_Paulo}" }
    networks: [voka_net]
    volumes: ["./backups:/backups", "./backup-loop.sh:/voka/backup-loop.sh:ro", "./backup-lib.sh:/voka/backup-lib.sh:ro"]
    entrypoint: ["bash", "/voka/backup-loop.sh"]
    # Healthy while the last scheduled backup did not fail.
    healthcheck: { test: ["CMD", "test", "!", "-f", "/backups/FALHOU-ultimo-backup.txt"], interval: 15s, retries: 1 }
    depends_on: { postgres: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "0.1", memory: 256m } } }
    <<: *logs
