# Voka atrás de um nginx que JÁ existe na VPS. Adicione este bloco (ex.: /etc/nginx/sites-available/voka),
# teste com `nginx -t` e recarregue com `systemctl reload nginx` (não derruba os outros sites).
# Certificado: `certbot --nginx -d vokaapp.com.br` (ou o método que o proxy já usa).
# Se o nginx roda num contentor Docker, troque 127.0.0.1:3001 por voka-app:3001 e 127.0.0.1:7880 por
# voka-livekit:7880, e ligue o contentor à rede do Voka:  docker network connect voka_net <nome-do-nginx>

map $http_upgrade $voka_connection { default upgrade; '' close; }

server {
    listen 80;
    server_name vokaapp.com.br;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vokaapp.com.br;
    ssl_certificate     /etc/letsencrypt/live/vokaapp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vokaapp.com.br/privkey.pem;

    client_max_body_size 90m;          # uploads de até 80 MB

    # Sinal das chamadas de voz/vídeo → LiveKit
    location ~ ^/(rtc|twirp)(/|$) {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voka_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    # Site, API e chat em tempo real → Voka
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voka_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
