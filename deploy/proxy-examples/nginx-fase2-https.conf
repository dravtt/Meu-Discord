# FASE 2 de 2 — HTTPS. Use SÓ depois que o certbot da fase 1 criou os arquivos abaixo:
#   sudo ls /etc/letsencrypt/live/vokaapp.com.br/fullchain.pem /etc/letsencrypt/live/vokaapp.com.br/privkey.pem
#   sudo cp /etc/nginx/sites-available/voka.conf /etc/nginx/sites-available/voka.conf.fase1   (cópia para voltar)
#   sudo cp nginx-fase2-https.conf /etc/nginx/sites-available/voka.conf     (troque vokaapp.com.br pelo domínio)
#   sudo nginx -t && sudo systemctl reload nginx
# Renovação automática do certificado com reload:
#   sudo certbot renew --dry-run --deploy-hook "systemctl reload nginx"
# Voltar à fase 1: sudo cp /etc/nginx/sites-available/voka.conf.fase1 /etc/nginx/sites-available/voka.conf && sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $voka_connection { default upgrade; '' close; }

server {
    listen 80;
    server_name vokaapp.com.br;
    location /.well-known/acme-challenge/ { root /var/www/voka-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vokaapp.com.br;
    ssl_certificate     /etc/letsencrypt/live/vokaapp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vokaapp.com.br/privkey.pem;

    client_max_body_size 90m;          # uploads de até 80 MB

    # Sinal das chamadas (WebSocket) → LiveKit em 127.0.0.1:7880
    location ~ ^/(rtc|twirp)(/|$) {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voka_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
    # Site, API e chat em tempo real (WebSocket) → Voka em 127.0.0.1:3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voka_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
