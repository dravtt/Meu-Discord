# Voka atrás de um Apache que JÁ existe. Precisa dos módulos: proxy proxy_http proxy_wstunnel rewrite headers ssl
# (a2enmod ...). Teste com `apachectl configtest` e recarregue com `systemctl reload apache2`.
<VirtualHost *:443>
    ServerName vokaapp.com.br
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/vokaapp.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vokaapp.com.br/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 94371840

    RewriteEngine On
    # WebSockets (chat e voz)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(rtc|twirp)(/.*)?$ ws://127.0.0.1:7880/$1$2 [P,L]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:3001/$1 [P,L]

    ProxyPass        /rtc   http://127.0.0.1:7880/rtc
    ProxyPassReverse /rtc   http://127.0.0.1:7880/rtc
    ProxyPass        /twirp http://127.0.0.1:7880/twirp
    ProxyPassReverse /twirp http://127.0.0.1:7880/twirp
    ProxyPass        /      http://127.0.0.1:3001/
    ProxyPassReverse /      http://127.0.0.1:3001/
    ProxyTimeout 3600
</VirtualHost>
