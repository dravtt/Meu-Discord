# FASE 1 de 2 — só HTTP, para emitir o certificado. Não referencia nenhum certificado.
# Não altera os vhosts existentes: é um arquivo NOVO, só para o domínio do Voka.
#   sudo mkdir -p /var/www/voka-acme
#   sudo cp nginx-fase1-http.conf /etc/nginx/sites-available/voka.conf      (troque vokaapp.com.br pelo domínio)
#   sudo ln -s /etc/nginx/sites-available/voka.conf /etc/nginx/sites-enabled/voka.conf
#   sudo nginx -t && sudo systemctl reload nginx          (reload só se o -t disser "successful")
#   sudo certbot certonly --webroot -w /var/www/voka-acme -d vokaapp.com.br
# Desfazer: sudo rm /etc/nginx/sites-enabled/voka.conf && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;              # IPv6: acrescente "listen [::]:80;" se a TOWER usa IPv6 nos outros vhosts
    server_name vokaapp.com.br;

    location /.well-known/acme-challenge/ { root /var/www/voka-acme; }
    location / { return 404; }
}
