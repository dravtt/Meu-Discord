services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # Voice/video media server. Dev keys (devkey/secret) match server/.env.example.
  livekit:
    image: livekit/livekit-server:v1.8
    # --node-ip 127.0.0.1: on Docker Desktop the container IP is unreachable from the browser.
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
