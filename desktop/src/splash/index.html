<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
  <style>
    html, body { margin: 0; height: 100%; background: #0f1115; color: #e6e9ef; font-family: system-ui, 'Segoe UI', sans-serif; -webkit-app-region: drag; user-select: none; }
    body { display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; }
    .logo { width: 72px; height: 72px; border-radius: 22px; background: #14b8a6; color: #04211e; display: grid; place-items: center; font-size: 38px; font-weight: 800; animation: pulse 1.3s infinite ease-in-out; }
    @keyframes pulse { 50% { transform: scale(.86) rotate(-6deg); } }
    #tip { font-size: 13px; color: #a7afbd; max-width: 220px; min-height: 34px; }
    #status { font-size: 12px; color: #6f7889; text-transform: uppercase; letter-spacing: .06em; }
    button { display: none; -webkit-app-region: no-drag; background: #14b8a6; color: #04211e; border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="logo">N</div>
  <div id="tip"></div>
  <div id="status">Iniciando…</div>
  <button id="retry">Tentar de novo</button>
  <script src="./splash.js"></script>
</body>
</html>
